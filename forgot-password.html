<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Relov</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components/navbar.css" />
    <link rel="stylesheet" href="css/components/footer.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
    <link rel="stylesheet" href="css/pages/auth.css" />
</head>
<body>

    <nav class="navbar" id="navbar">
        <div class="container-custom flex items-center justify-between">
            <a href="index.html" class="navbar-logo">
                <span class="navbar-logo-icon">R</span>
                Relov
            </a>
            <div class="navbar-actions">
                <a href="login.html" class="navbar-login-btn">Back to Login</a>
            </div>
        </div>
    </nav>

    <section class="auth-section">
        <div class="container-custom">
            <div class="auth-container">
                <div class="auth-header">
                    <div class="auth-icon">
                        <i class="fas fa-key"></i>
                    </div>
                    <h1 class="auth-title">Reset Password</h1>
                    <p class="auth-subtitle">We'll send you a link to reset your password</p>
                </div>
                
                <form class="auth-form" onsubmit="event.preventDefault(); showToast('📧 Password reset email sent!', 'success');">
                    <div class="form-group">
                        <label class="form-label required">Email Address</label>
                        <div class="input-icon-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" class="form-input" placeholder="student@university.edu" required />
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-primary btn-full btn-lg">
                        Send Reset Link
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
                
                <div class="auth-footer">
                    <p><a href="login.html">← Back to Login</a></p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container-custom">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p class="footer-copyright">© 2024 Relov. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            if (type === 'success') toast.classList.add('success');
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
